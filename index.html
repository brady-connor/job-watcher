<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today - Job Watcher</title>
<meta name="theme-color" content="#12263a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<main>
<h1>Today</h1>
<p class="muted">Last run: <span id="runtime">loading...</span></p>
<p id="msg" class="msg" hidden></p>
<div id="counts" class="counts"></div>
<h2>Sources</h2>
<div class="wrap"><table><thead><tr><th>Source</th><th>Status</th><th>Postings</th></tr></thead><tbody id="sources"></tbody></table></div>
<h2 id="newh">New postings in the latest run</h2>
<ul id="new" class="postings"></ul>
<h2 id="removedh">Removed postings in the latest run</h2>
<ul id="removed" class="postings"></ul>
</main>
<script src="app.js"></script>
<script src="today.js"></script>
</body>
</html>
